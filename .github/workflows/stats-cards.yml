name: Stats cards

# Self-hosted replacement for third-party stats widgets: draws stats/overview.svg
# and stats/languages.svg from the GitHub API, so the profile never shows a broken image.
on:
  schedule:
    - cron: "30 1 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/stats_cards.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats
          git diff --cached --quiet && exit 0
          git commit -m "Update stats cards"
          git pull --rebase
          git push
